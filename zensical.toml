[project]
site_name = "SAYC Bridge Reference"
site_description = "Standard American Yellow Card bidding, card play, and defense."
use_directory_urls = true
extra_css = ["stylesheets/reference.css"]
nav = [
  { "Home" = "index.md" },
  { "Bidding" = [
    { "Opening bids" = "bidding/opening-bids.md" },
    { "One of a major" = "bidding/major-openings.md" },
    { "One of a minor" = "bidding/minor-openings.md" },
    { "Rebids and continuations" = "bidding/rebids.md" },
    { "Notrump openings" = "bidding/notrump.md" },
    { "Strong 2♣" = "bidding/strong-two-clubs.md" },
    { "Weak twos and preempts" = "bidding/preempts.md" },
    { "Competitive bidding" = "bidding/competition.md" },
    { "Slam bidding" = "bidding/slam.md" },
    ] },
  { "Conventions and practices" = [
      { "Overview and references" = "conventions/index.md" },
      { "Michaels cuebids" = "conventions/michaels-cuebids.md" },
      { "Doubles" = "conventions/doubles.md" },
      { "Counting winners and losers" = "conventions/counting-winners-and-losers.md" },
    ] },
  { "Play and defense" = [
    { "How a hand is played" = "play/trick-play.md" },
    { "Opening leads and signals" = "play/defensive-card-play.md" },
  ] },
  { "Lessons and sources" = [
    { "Linking lessons" = "reference/lesson-links.md" },
    { "Sources and classroom agreement" = "reference/sources.md" },
  ] },
  { "Practice lessons" = [
    { "Minor support and a four-card major" = "lessons/bidding/minor-support-and-a-major.md" },
    { "Using a ruff as an entry" = "lessons/play/ruff-as-an-entry.md" },
  ] },
  { "From our games" = [
    { "November 16" = "from-our-games/2026-11-16/index.md" },
    { "Board 25" = "from-our-games/2026-11-16/board-25.md" },
    { "Board 16" = "from-our-games/2026-11-16/board-16.md" },
  ] },
  { "Overcalls" = [
  { "Cheat sheet" = "overcalls/overcall-cheat-sheet.md" },
  { "Demonstration hands" = "overcalls/overcall-demonstrations.md" },
  { "Handviewer examples" = "overcalls/overcall-handviewer.md" },
] },
  { "Cheat Sheets" = [
    { "Jump Bids" = "Bridge_Jump_Bids_Cheat_Sheet.md"},
    { "Passed Hand Spade Raise" = "Passed_Hand_Spade_Raise.md"}

  ]}
]

[project.theme]
language = "en"
features = ["navigation.sections", "navigation.footer", "navigation.top", "navigation.tracking", "search.highlight"]

[project.theme.font]
text = "Atkinson Hyperlegible Next"
code = "IBM Plex Mono"

[[project.theme.palette]]
scheme = "default"
primary = "teal"
accent = "teal"

[project.markdown_extensions]
attr_list = {}
tables = {}
admonition = {}
toc.permalink = true

